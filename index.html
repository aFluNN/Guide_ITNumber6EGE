            background-color: rgba(0, 0, 0, 0.5);
            backdrop-filter: blur(5px);

        }

        @keyframes fadeIn {
            from { opacity: 0; }
            to { opacity: 1; }
        }
        .animate-fade-in {
            animation: fadeIn 0.3s ease-out forwards;
        }

        @keyframes scaleIn {
            from { opacity: 0; transform: scale(0.95); }
            to { opacity: 1; transform: scale(1); }
        }
        .animate-scale-in {
            animation: scaleIn 0.2s ease-out forwards;
        }

        /* --- BACKGROUND ANIMATION --- */
        .background-shapes {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            z-index: 0;
            overflow: hidden;
            pointer-events: none;
        }

        .shape {
            position: absolute;
            bottom: -150px;
            border-radius: 15%;
            will-change: transform, opacity;
            animation: floatUp linear infinite;
        }

        @keyframes floatUp {
            0% {
                bottom: -150px;
                transform: rotate(0deg) scale(0.8);
                opacity: 0;
            }
            10% {
                opacity: 0.6;
            }
            90% {
                opacity: 0.4;
            }
            100% {
                bottom: 110vh;
                transform: rotate(360deg) scale(1.2);
                opacity: 0;
            }
        }

t.pu() # Поднять хвост

# --- ВИЗУАЛЬНАЯ СЕТКА ---

            const q = quizData[currentQuestion];

                <div className="max-w-2xl mx-auto px-4 mt-8">

                                    disabled={selectedOption !== null}
                                    className={`w-full text-left p-4 rounded-lg border-2 transition-all ${
                                        selectedOption !== null
                                            ? opt.correct ? 'border-green-500 bg-green-50 text-green-700' : 'border-gray-200 text-gray-400'
                                            : 'border-gray-200 hover:border-indigo-500 hover:bg-indigo-50'
                                    }`}
                                >
                                    {opt.text}
                                </button>
                            ))}
                        </div>
                        {selectedOption !== null && (
                            <div className={`mt-6 p-4 rounded-lg ${isCorrect ? 'bg-green-100 text-green-800' : 'bg-red-100 text-red-800'}`}>

                                <p className="text-sm">{q.explanation}</p>
                                <button onClick={nextQuestion} className="mt-4 bg-gray-800 text-white px-6 py-2 rounded-lg text-sm hover:bg-gray-900 transition">{currentQuestion === quizData.length - 1 ? 'Завершить' : 'Далее'}</button>
                            </div>
                        )}
                    </div>
                </div>
            );
        };

// --- UPDATED SIMULATOR SECTION (Fixed Boundary Calculation 121 vs 81) ---
        const SimulatorSection = () => {
            const canvasRef = useRef(null);
            
            // --- STATE ---
            const [boundaryMode, setBoundaryMode] = useState('exclude'); // 'include', 'exclude'
            
            // Код по умолчанию
            const [code, setCode] = useState("Опустить хвост\nПовтори 4 [\n  Вперед 10\n  Направо 90\n]");
            
            const [scale, setScale] = useState(30); 
            const [panOffset, setPanOffset] = useState({ x: 0, y: 0 }); 
            const [isDragging, setIsDragging] = useState(false);
            const [lastMousePos, setLastMousePos] = useState({ x: 0, y: 0 });

            const [resultText, setResultText] = useState("Нажмите 'Запустить' для расчета.");
            const [pointsCount, setPointsCount] = useState(0);
            
            const [simData, setSimData] = useState(null); 

            // --- 1. RECURSIVE PARSER ---
            const parseAndExpand = (str) => {
                let s = str.toLowerCase()
                    .replace(/\[/g, ' [ ')
                    .replace(/\]/g, ' ] ')
                    .replace(/\s+/g, ' ')
                    .trim();
                const tokens = s.split(' ');
                
                const expand = (tokenList) => {
                    let result = [];
                    let i = 0;
                    while (i < tokenList.length) {
                        const t = tokenList[i];
                        if (t === 'повтори' || t === 'repeat') {
                            const count = parseInt(tokenList[i+1]);
                            if (isNaN(count)) { i++; continue; }
                            
                            let balance = 0;
                            let start = -1;
                            let end = -1;
                            
                            let j = i + 2; 
                            if (tokenList[j] === '[') {
                                start = j + 1;
                                balance = 1;
                                j++;
                                while (j < tokenList.length && balance > 0) {
                                    if (tokenList[j] === '[') balance++;
                                    if (tokenList[j] === ']') balance--;
                                    if (balance === 0) { end = j; break; }
                                    j++;
                                }
                            }
                            
                            if (start !== -1 && end !== -1) {
                                const innerTokens = tokenList.slice(start, end);
                                const expandedInner = expand(innerTokens);
                                for (let k = 0; k < count; k++) {
                                    result.push(...expandedInner);
                                }
                                i = end + 1;
                            } else {
                                i += 2; 
                            }
                        } else {
                            result.push(t);
                            i++;
                        }
                    }
                    return result;
                };

                return expand(tokens);
            };

            const executeTurtle = (sourceCode) => {
                const finalTokens = parseAndExpand(sourceCode);
                
                let x = 0, y = 0, angle = 90; 
                let isPenDown = false; 

                let paths = []; 
                let currentPath = [];

                const finishPath = () => {
                    if (currentPath.length > 1) { 
                        paths.push([...currentPath]);
                    }
                    currentPath = [];
                };

                let i = 0;
                while(i < finalTokens.length) {
                    const cmd = finalTokens[i];
                    const val = parseFloat(finalTokens[i+1]);

                    if (['опустить', 'pd', 'down'].includes(cmd) || (cmd === 'по' && finalTokens[i+1] !== 'втори')) { 
                         isPenDown = true;
                         if (currentPath.length === 0) currentPath.push({x, y});
                         i++;
                         if (cmd === 'опустить') i++; 
                    }
                    else if (['поднять', 'pu', 'up', 'пх'].includes(cmd)) {
                         isPenDown = false;
                         finishPath();
                         i++;
                         if (cmd === 'поднять') i++;
                    }
                    else if ((cmd === 'вперед' || cmd === 'forward' || cmd === 'вп') && !isNaN(val)) {
                        const rad = angle * Math.PI / 180;
                        x += val * Math.cos(rad);
                        y += val * Math.sin(rad); 
                        x = parseFloat(x.toFixed(5));
                        y = parseFloat(y.toFixed(5));
                        
                        if (isPenDown) {
                            if (currentPath.length === 0) currentPath.push({x: x - val*Math.cos(rad), y: y - val*Math.sin(rad)});
                            currentPath.push({x, y});
                        }
                        i += 2;
                    } 
                    else if ((cmd === 'направо' || cmd === 'right' || cmd === 'пр') && !isNaN(val)) {
                        angle -= val;
                        i += 2;
                    } 
                    else if ((cmd === 'налево' || cmd === 'left' || cmd === 'лв') && !isNaN(val)) {
                        angle += val;
                        i += 2;
                    } 
                    else if (cmd === ']' || cmd === '[' || cmd === 'хвост') {
                        i++; 
                    } else {
                        i++;
                    }
                }
                finishPath(); 

                return { paths, finalX: x, finalY: y };
            };

            // --- 2. GEOMETRY KERNEL (IMPROVED) ---

            // Проверка: лежит ли точка СТРОГО на отрезке
            const isPointOnSegment = (px, py, v1, v2) => {
                const epsilon = 0.05; // Погрешность для "попадания" в линию
                
                // Проверка Bounding Box отрезка
                const minX = Math.min(v1.x, v2.x) - epsilon;
                const maxX = Math.max(v1.x, v2.x) + epsilon;
                const minY = Math.min(v1.y, v2.y) - epsilon;
                const maxY = Math.max(v1.y, v2.y) + epsilon;

                if (px < minX || px > maxX || py < minY || py > maxY) return false;

                // Расстояние от точки до прямой
                // (y2-y1)x - (x2-x1)y + x2y1 - y2x1 = 0
                const a = v1.y - v2.y;
                const b = v2.x - v1.x;
                const c = v1.x * v2.y - v2.x * v1.y;
                
                const dist = Math.abs(a * px + b * py + c) / Math.sqrt(a * a + b * b);
                return dist <= epsilon;
            };

            // Проверка: находится ли точка внутри (Ray Casting)
            const isPointInsidePath = (px, py, path) => {
                let inside = false;
                for (let k = 0, j = path.length - 1; k < path.length; j = k++) {
                    const xi = path[k].x, yi = path[k].y;
                    const xj = path[j].x, yj = path[j].y;
                    
                    const intersect = ((yi > py) !== (yj > py))
                        && (px < (xj - xi) * (py - yi) / (yj - yi) + xi);
                    if (intersect) inside = !inside;
                }
                return inside;
            };

            // --- 3. MAIN SIMULATION ---
            const runSimulation = () => {
                const { paths } = executeTurtle(code);

                if (paths.length === 0) {
                    setResultText("Нет замкнутых контуров. Проверьте команду 'Опустить хвост'.");
                    setPointsCount(0);
                    setSimData({ paths: [], finalPoints: [] });
                    return;
                }

                // Global Bounding Box
                let minX = Infinity, maxX = -Infinity, minY = Infinity, maxY = -Infinity;
                paths.forEach(path => {
                    path.forEach(v => {
                        minX = Math.min(minX, v.x); maxX = Math.max(maxX, v.x);
                        minY = Math.min(minY, v.y); maxY = Math.max(maxY, v.y);
                    });
                });
                
                const startX = Math.floor(minX);
                const endX = Math.ceil(maxX);
                const startY = Math.floor(minY);
                const endY = Math.ceil(maxY);

                let finalPoints = [];

                for (let px = startX; px <= endX; px++) {
                    for (let py = startY; py <= endY; py++) {
                        
                        let isOnEdge = false;
                        let isInside = false;

                        // Проверяем принадлежность ко всем контурам
                        for (let path of paths) {
                            // 1. Сначала проверяем, не лежит ли точка на границе
                            for (let k = 0; k < path.length - 1; k++) {
                                if (isPointOnSegment(px, py, path[k], path[k+1])) {
                                    isOnEdge = true;
                                    break;
                                }
                            }
                            if (isOnEdge) break;

                            // 2. Если не на границе, проверяем внутренность
                            if (isPointInsidePath(px, py, path)) {
                                isInside = true;
                                break; // Достаточно попасть в один контур
                            }
                        }

                        // --- ФИНАЛЬНОЕ РЕШЕНИЕ ---
                        if (boundaryMode === 'include') {
                            // Берем и те, что на границе, и те, что внутри
                            if (isOnEdge || isInside) {
                                finalPoints.push({x: px, y: py});
                            }
                        } else {
                            // Берем только те, что строго внутри и НЕ на границе
                            if (isInside && !isOnEdge) {
                                finalPoints.push({x: px, y: py});
                            }
                        }
                    }
                }

                setPointsCount(finalPoints.length);
                setSimData({
                    paths: paths,
                    finalPoints: finalPoints
                });
                
                let boundText = boundaryMode === 'include' ? "с границами" : "строго внутри";
                setResultText(`Фигура построена, поиск ${boundText}.`);
            };

            // --- CANVAS HANDLERS ---
            const handleMouseDown = (e) => {
                setIsDragging(true);
                const clientX = e.touches ? e.touches[0].clientX : e.clientX;
                const clientY = e.touches ? e.touches[0].clientY : e.clientY;
                setLastMousePos({ x: clientX, y: clientY });
            };

            const handleMouseMove = (e) => {
                if (!isDragging) return;
                const clientX = e.touches ? e.touches[0].clientX : e.clientX;
                const clientY = e.touches ? e.touches[0].clientY : e.clientY;
                const dx = clientX - lastMousePos.x;
                const dy = clientY - lastMousePos.y;
                setPanOffset(prev => ({ x: prev.x + dx, y: prev.y + dy }));
                setLastMousePos({ x: clientX, y: clientY });
            };

            const handleMouseUp = () => setIsDragging(false);

            // --- RENDER ---
            useEffect(() => {
                const canvas = canvasRef.current;
                if (!canvas) return;
                
                const ctx = canvas.getContext('2d');
                const width = canvas.width;
                const height = canvas.height;
                
                const centerX = Math.floor(width / 2) + panOffset.x;
                const centerY = Math.floor(height / 2) + panOffset.y;

                ctx.clearRect(0, 0, width, height);
                ctx.fillStyle = '#ffffff';
                ctx.fillRect(0, 0, width, height);

                // Grid
                const startGridX = -Math.ceil(centerX / scale);
                const endGridX = Math.ceil((width - centerX) / scale);
                const startGridY = -Math.ceil(centerY / scale);
                const endGridY = Math.ceil((height - centerY) / scale);

                ctx.beginPath();
                ctx.strokeStyle = '#e2e8f0'; 
                ctx.lineWidth = 1;
                for (let i = startGridX; i <= endGridX; i++) {
                    const x = Math.floor(centerX + i * scale) + 0.5;
                    ctx.moveTo(x, 0); ctx.lineTo(x, height);
                }
                for (let i = startGridY; i <= endGridY; i++) {
                    const y = Math.floor(centerY + i * scale) + 0.5;
                    ctx.moveTo(0, y); ctx.lineTo(width, y);
                }
                ctx.stroke();

                // Axis
                ctx.beginPath();
                ctx.strokeStyle = '#94a3b8';
                ctx.lineWidth = 2;
                const axisX = Math.floor(centerX) + 0.5;
                const axisY = Math.floor(centerY) + 0.5;
                if (axisX >= 0 && axisX <= width) { ctx.moveTo(axisX, 0); ctx.lineTo(axisX, height); }
                if (axisY >= 0 && axisY <= height) { ctx.moveTo(0, axisY); ctx.lineTo(width, axisY); }
                ctx.stroke();

                if (!simData) return;

                // Draw Paths
                simData.paths.forEach(path => {
                    if (path.length > 0) {
                        ctx.beginPath();
                        ctx.strokeStyle = '#4f46e5';
                        ctx.lineWidth = 2;
                        ctx.moveTo(centerX + path[0].x * scale, centerY - path[0].y * scale);
                        for (let i = 1; i < path.length; i++) {
                            ctx.lineTo(centerX + path[i].x * scale, centerY - path[i].y * scale);
                        }
                        ctx.stroke();
                        ctx.fillStyle = 'rgba(79, 70, 229, 0.1)';
                        ctx.fill();
                    }
                });

                // Draw Points
                ctx.fillStyle = '#ef4444'; 
                simData.finalPoints.forEach(p => {
                    const px = centerX + p.x * scale;
                    const py = centerY - p.y * scale;
                    if (px < -10 || px > width + 10 || py < -10 || py > height + 10) return;
                    
                    ctx.beginPath();
                    const dotRadius = Math.min(Math.max(scale / 6, 2), 5);
                    ctx.arc(px, py, dotRadius, 0, Math.PI * 2); 
                    ctx.fill();
                });

            }, [scale, panOffset, simData]);

            return (
                <div className="max-w-6xl mx-auto px-4 mt-8 flex flex-col lg:flex-row gap-6 animate-fade-in pb-12">
                    {/* LEFT PANEL */}
                    <div className="w-full lg:w-1/3 space-y-4">
                        <div className="bg-white/95 backdrop-blur p-5 rounded-xl shadow-lg flex flex-col gap-4">
                            
                            <div>
                                <h3 className="text-xs font-bold text-gray-500 uppercase mb-1 flex items-center justify-between">
                                    <span>Алгоритм</span>
                                </h3>
                                <textarea 
                                    value={code}
                                    onChange={(e) => setCode(e.target.value)}
                                    className="w-full h-40 p-3 bg-gray-900 text-indigo-300 border-indigo-200 focus:border-indigo-500 text-sm font-mono rounded-lg border outline-none resize-none transition-colors"
                                ></textarea>
                            </div>

                            {/* Boundary Toggle */}
                            <div className="flex items-center justify-between bg-gray-50 p-2 rounded border border-gray-200">
                                <span className="text-sm text-gray-700 font-medium">Точки на границах:</span>
                                <div className="flex bg-gray-200 rounded p-0.5">
                                    <button onClick={() => setBoundaryMode('exclude')} className={`px-2 py-0.5 text-xs rounded transition ${boundaryMode === 'exclude' ? 'bg-white shadow text-red-600 font-bold' : 'text-gray-500'}`}>Нет</button>
                                    <button onClick={() => setBoundaryMode('include')} className={`px-2 py-0.5 text-xs rounded transition ${boundaryMode === 'include' ? 'bg-white shadow text-green-600 font-bold' : 'text-gray-500'}`}>Да</button>
                                </div>
                            </div>
                            
                            <div className="flex gap-2">
                                <button onClick={runSimulation} className="flex-1 bg-gray-800 text-white py-2 rounded-lg hover:bg-black transition flex items-center justify-center font-bold text-sm shadow-md active:transform active:scale-95">
                                    <IconPlay className="w-4 h-4 mr-2" /> Рассчитать
                                </button>
                                <button onClick={() => setPanOffset({x:0, y:0})} className="px-3 bg-gray-200 text-gray-600 rounded-lg hover:bg-gray-300 transition" title="Центрировать">
                                    <IconZap className="w-4 h-4" />
                                </button>
                            </div>
                            
                            <div className="pt-2 border-t border-gray-100">
                                <div className="flex justify-between text-xs text-gray-500 mb-1">
                                    <span>Zoom</span>
                                    <span>{scale}px</span>
                                </div>
                                <input type="range" min="10" max="100" step="1" value={scale} onChange={(e) => setScale(Number(e.target.value))} className="w-full h-1.5 bg-gray-200 rounded-lg appearance-none cursor-pointer accent-gray-800"/>
                            </div>
                        </div>

                        <div className="bg-white/95 backdrop-blur p-4 rounded-xl shadow-lg border-l-4 border-indigo-500">
                            <div className="text-3xl font-extrabold text-gray-800">{pointsCount}</div>
                            <p className="text-xs text-gray-500 font-medium uppercase tracking-wide">Точек внутри</p>
                            <p className="text-xs text-gray-400 mt-2 italic">{resultText}</p>
                        </div>
                    </div>

                    {/* RIGHT PANEL - Fixed Min Height */}
                    <div className="w-full lg:w-2/3 bg-gray-50 rounded-xl shadow-inner border border-gray-200 overflow-hidden relative min-h-[400px] md:min-h-[600px] touch-none">
                         <canvas 
                            ref={canvasRef} 
                            width={1000} 
                            height={800} 
                            className={`w-full h-full block cursor-${isDragging ? 'grabbing' : 'grab'} object-cover`}
                            onMouseDown={handleMouseDown}
                            onMouseMove={handleMouseMove}
                            onMouseUp={handleMouseUp}
                            onMouseLeave={handleMouseUp}
                            onTouchStart={handleMouseDown}
                            onTouchMove={handleMouseMove}
                            onTouchEnd={handleMouseUp}
                         ></canvas>
                         <div className="absolute top-4 right-4 flex flex-col gap-2 items-end pointer-events-none">
                            <div className="bg-white/80 backdrop-blur px-3 py-1 rounded shadow-sm text-xs text-gray-500 border border-gray-200">Тяни чтобы двигать</div>
                         </div>
                    </div>
                </div>
            );
        };

        const Footer = ({ onEasterEggClick }) => (
             <footer className="bg-gray-800 text-gray-400 py-8 mt-12 text-center text-sm relative z-10 rounded-t-[2.5rem]">
                <p>Разработано в рамках школьного индивидуального проекта</p>
                <p onClick={onEasterEggClick} className="cursor-default hover:text-gray-300 transition-colors">2026</p>
            </footer>
        );

        // --- EASTER EGG MODAL ---
        const EasterEggModal = ({ onClose }) => {
            useEffect(() => {
                const script = document.createElement('script');
                script.src = "https://tenor.com/embed.js";
                script.async = true;
                document.body.appendChild(script);
                return () => {
                    document.body.removeChild(script);
                };
            }, []);

            return ReactDOM.createPortal(
                <div className="fixed inset-0 z-[10000] bg-black flex items-center justify-center cursor-pointer" onClick={onClose}>
                    <div className="w-full h-full flex items-center justify-center">
                         <div className="tenor-gif-embed" data-postid="16802068312873307417" data-share-method="host" data-aspect-ratio="1" data-width="100%">
                            <a href="https://tenor.com/view/turtle-gif-16802068312873307417">Turtle Sticker</a>
                        </div>
                    </div>
                </div>,
                document.body
            );
        };

        const App = () => {
            const [activeTab, setActiveTab] = useState('theory');
            const [tabHistory, setTabHistory] = useState([]);
            const [showEasterEgg, setShowEasterEgg] = useState(false);

            useEffect(() => { lucide.createIcons(); }, [activeTab]);

            // Track tab clicks for Easter Egg
            const handleTabChange = (id) => {
                setActiveTab(id);
                setTabHistory(prev => [...prev, id].slice(-5)); // Keep only last 5
            };

            const checkEasterEgg = () => {
                const requiredSequence = ['detailed', 'quiz', 'detailed', 'theory', 'examples'];
                if (JSON.stringify(tabHistory) === JSON.stringify(requiredSequence)) {
                    setShowEasterEgg(true);
                }
            };

            return (
                <div className="min-h-screen flex flex-col relative">
                    <BackgroundEffect />
                    <Navigation activeTab={activeTab} onTabChange={handleTabChange} />
                    <Hero />
                    <main className="flex-grow z-10">
                        {activeTab === 'theory' && <TheorySection />}
                        {activeTab === 'detailed' && <DetailedSection />}
                        {activeTab === 'examples' && <ExamplesSection />}
                        {activeTab === 'quiz' && <QuizSection />}
                        {activeTab === 'simulation' && <SimulatorSection />}
                    </main>
                    <Footer onEasterEggClick={checkEasterEgg} />
                    {showEasterEgg && <EasterEggModal onClose={() => setShowEasterEgg(false)} />}
                </div>
            );
        };

        const root = ReactDOM.createRoot(document.getElementById('root'));
        root.render(<App />);
    </script>
</body>
</html>
